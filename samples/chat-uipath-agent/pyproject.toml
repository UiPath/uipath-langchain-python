[project]
name = "chat-uipath-agent"
version = "0.0.1"
description = "Chat agent with UiPath LLM and web search"
authors = [{ name = "John Doe", email = "john.doe@myemail.com" }]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.10",
    "langchain-community>=0.4.1",
    "ddgs>=9.6.1",
    "uipath-langchain>=0.18.46",
    "uipath>=2.14.41",
]

[dependency-groups]
dev = [
     "uipath-dev",
]

