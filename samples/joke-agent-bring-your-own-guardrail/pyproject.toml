[project]
name = "joke-agent-bring-your-own-guardrail"
version = "0.0.1"
description = "Joke agent guarded by a Bring Your Own Guardrail (BYOG) configuration - middleware and decorator flavors in one agent"
authors = [{ name = "John Doe", email = "john.doe@myemail.com" }]
requires-python = ">=3.11"
dependencies = [
    "uipath-langchain>=0.14.5, <0.15.0",
    "uipath>=2.13.7, <2.14.0",
]

[dependency-groups]
dev = [
    "uipath-dev",
]

