name: Model onboarding

# On-demand run of the model-onboarding testcase against an arbitrary model.
# Nothing is committed: the model spec comes from the workflow inputs and is
# written into input.json at runtime. Start a run from the Actions UI
# ("Run workflow") or with `gh workflow run model_onboarding.yml -f ...`.

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Vendor-qualified model ID (e.g. gpt-5.2-2025-12-11, anthropic.claude-sonnet-4-5-20250929-v1:0)"
        required: true
        type: string
      api_flavors:
        description: "Comma-separated vendor_type:api_flavor pairs passed straight to get_chat_model, e.g. openai:responses, openai:chat-completions, awsbedrock:converse, awsbedrock:invoke, awsbedrock:AnthropicMessages, vertexai:generate-content (vendor_type: alone autodetects the flavor)"
        required: true
        type: string
        default: "openai:responses"
      agenthub_config:
        description: "AgentHub config header value (must exist in the target tenant)"
        required: false
        type: string
        default: "agentsplayground"
      environments:
        description: "Which environments to run against"
        required: true
        type: choice
        default: "alpha,staging"
        options:
          - "alpha"
          - "staging"
          - "cloud"
          - "alpha,staging"
          - "alpha,staging,cloud"

permissions:
  contents: read
  actions: read

jobs:
  # Turn the comma-separated `environments` input into a JSON array the matrix
  # can consume, so a single dispatch can fan out across chosen environments.
  resolve-environments:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.split.outputs.environments }}
    steps:
      - name: Split environments input
        id: split
        run: |
          envs_json=$(echo "${{ inputs.environments }}" \
            | tr ',' '\n' \
            | sed 's/[[:space:]]//g' \
            | grep -v '^$' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Resolved environments: $envs_json"
          echo "environments=$envs_json" >> "$GITHUB_OUTPUT"

  model-onboarding:
    needs: [resolve-environments]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm
      env:
        UIPATH_JOB_KEY: "3a03d5cb-fa21-4021-894d-a8e2eda0afe0"
        UIPATH_TRACING_ENABLED: false
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.resolve-environments.outputs.environments) }}

    name: "model-onboarding / ${{ matrix.environment }} / ${{ inputs.model_name }}"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: uv sync

    - name: Build input.json from dispatch inputs
      working-directory: testcases/model-onboarding
      env:
        MODEL_NAME: ${{ inputs.model_name }}
        API_FLAVORS: ${{ inputs.api_flavors }}
        AGENTHUB_CONFIG: ${{ inputs.agenthub_config }}
      run: |
        # Build input.json with python3 — the uv container does NOT ship jq
        # (first live dispatch failed with exit 127). python3 is guaranteed in
        # the image and builds valid JSON regardless of input characters.
        python3 - <<'PY'
        import json
        import os

        def split(csv: str) -> list[str]:
            return [x.strip() for x in (csv or "").split(",") if x.strip()]

        spec = {
            "model_spec": {
                "model_name": os.environ["MODEL_NAME"],
                "agenthub_config": os.environ["AGENTHUB_CONFIG"],
                "api_flavors": split(os.environ.get("API_FLAVORS", "")),
            },
        }
        with open("input.json", "w", encoding="utf-8") as f:
            json.dump(spec, f, indent=2)
        print("=== Generated input.json ===")
        print(json.dumps(spec, indent=2))
        PY

    - name: Run testcase
      env:
        ENVIRONMENT: ${{ matrix.environment }}
        CLIENT_ID: ${{ matrix.environment == 'alpha' && secrets.ALPHA_TEST_CLIENT_ID || matrix.environment == 'staging' && secrets.STAGING_TEST_CLIENT_ID || matrix.environment == 'cloud' && secrets.CLOUD_TEST_CLIENT_ID }}
        CLIENT_SECRET: ${{ matrix.environment == 'alpha' && secrets.ALPHA_TEST_CLIENT_SECRET || matrix.environment == 'staging' && secrets.STAGING_TEST_CLIENT_SECRET || matrix.environment == 'cloud' && secrets.CLOUD_TEST_CLIENT_SECRET }}
        BASE_URL: ${{ matrix.environment == 'alpha' && secrets.ALPHA_BASE_URL || matrix.environment == 'staging' && secrets.STAGING_BASE_URL || matrix.environment == 'cloud' && secrets.CLOUD_BASE_URL }}
      working-directory: testcases/model-onboarding
      run: |
        echo "Running model-onboarding"
        echo "Environment: ${{ matrix.environment }}"
        echo "Model: ${{ inputs.model_name }}"

        bash run.sh

        # TEMPORARY DIAGNOSTIC — identifies the CI principal so its Orchestrator
        # permissions can be checked (attachment creation currently 403s). Prints
        # only non-secret JWT claims (sub / client_id / org / tenant); never the
        # token or the client secret. Remove once the 403 is resolved.
        echo "=== CI principal (from token claims) ==="
        python3 - <<'PY' || echo "(diagnostic failed; not fatal)"
        import base64, glob, json, os, re

        def claims(tok):
            payload = tok.split(".")[1]
            payload += "=" * (-len(payload) % 4)
            return json.loads(base64.urlsafe_b64decode(payload))

        found = False
        # uipath auth writes the token into the project .env / a json store.
        for path in [".env", *glob.glob(os.path.expanduser("~/.uipath/**/*.json"), recursive=True)]:
            try:
                text = open(path, encoding="utf-8", errors="replace").read()
            except OSError:
                continue
            for tok in re.findall(r"ey[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]+", text):
                try:
                    c = claims(tok)
                except Exception:
                    continue
                keep = {k: c.get(k) for k in
                        ("sub", "client_id", "azp", "prt_id", "prt_name", "tenant_id",
                         "tenantId", "expZone", "aud", "scope") if c.get(k)}
                print(f"source={path}")
                print(json.dumps(keep, indent=2)[:1200])
                found = True
                break
            if found:
                break
        if not found:
            print("no JWT found — checked .env and ~/.uipath/**.json")
        PY

        bash ../common/validate_output.sh
