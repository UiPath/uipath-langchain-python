[project]
name = "multimodal-invoke"
version = "0.0.1"
description = "Test multimodal LLM invoke with file attachments via get_chat_model"
authors = [{ name = "John Doe", email = "john.doe@myemail.com" }]
dependencies = [
    "langgraph>=0.2.70",
    "langchain-core>=0.3.34",
    "langgraph-checkpoint-sqlite>=2.0.3",
    "uipath-langchain[vertex,bedrock]",
    "pydantic>=2.10.6",
]
requires-python = ">=3.11"

[tool.uv]
exclude-newer = "2 days"

[tool.uv.exclude-newer-package]
uipath = false
uipath-core = false
uipath-platform = false
uipath-runtime = false
uipath-dev = false
uipath-langchain-client = false
uipath-llm-client = false
jsonschema-pydantic-converter = false

[tool.uv.sources]
uipath-langchain = { path = "../../", editable = true }
