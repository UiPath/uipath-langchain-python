[project]
name = "chat-models-agent"
version = "0.0.1"
description = "Chat models testing agent for UiPath LangChain"
authors = [{ name = "John Doe", email = "john.doe@myemail.com" }]
dependencies = [
    "langgraph>=1.0.4",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "python-dotenv>=1.0.1",
    "uipath-langchain[all]",
    "pydantic>=2.10.6",
    "aiohttp>=3.11.12",
    "typing-extensions>=4.12.2",
]
requires-python = ">=3.11"

[tool.uv]
exclude-newer = "2 days"

[tool.uv.exclude-newer-package]
uipath = false
uipath-core = false
uipath-platform = false
uipath-runtime = false
uipath-dev = false
uipath-langchain-client = false
uipath-llm-client = false
jsonschema-pydantic-converter = false

[tool.uv.sources]
uipath-langchain = { path = "../../", editable = true }
