[project]
name = "simple-http-mcp"
version = "0.0.1"
description = "MCP over Streamable HTTP protocol-version matrix testcase"
authors = [{ name = "John Doe", email = "john.doe@myemail.com" }]
dependencies = [
    "langgraph>=0.2.70",
    "langchain-core>=0.3.34",
    "langgraph-checkpoint-sqlite>=2.0.3",
    "python-dotenv>=1.0.1",
    "uipath-langchain",
    "pydantic>=2.10.6",
    "typing-extensions>=4.12.2",
    "mcp==2.0.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
]
requires-python = ">=3.11"

[tool.uv]
exclude-newer = "2 days"

[tool.uv.exclude-newer-package]
uipath = false
uipath-core = false
uipath-platform = false
uipath-runtime = false
uipath-dev = false
uipath-langchain-client = false
uipath-llm-client = false
jsonschema-pydantic-converter = false

[tool.uv.sources]
uipath-langchain = { path = "../../", editable = true }
